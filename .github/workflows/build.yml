              boolean classMatches(Class<?> k) {
                  if (hasAny(simple(k), EXCL)) return false;
                  for (Class<?> c = k; c != null && c != ViewGroup.class && c != View.class && c != Object.class; c = c.getSuperclass()) {
                      String full = c.getName().toLowerCase(Locale.ROOT);
                      if (full.startsWith("android.")) break;
                      String s = simple(c);
                      if (hasAny(s, CLS)) return true;
                      if (home && hasAny(s, HOME_TOK)) return true;
                      // sistem gezinme cubugu (navigationbarview) bilerek eslestirilmiyor: her uygulamada gorunuyordu
                      for (String t : cfg.customTokens) if (full.contains(t)) return true;
                  }
                  return false;
              }

