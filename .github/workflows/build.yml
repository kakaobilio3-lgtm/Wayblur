name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Sürüm adı (ör. dev-1)'
        required: false
        default: 'dev'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate project files
        run: |
          set -e
          PROJECT_DIR="$RUNNER_TEMP/WayBlur"
          mkdir -p "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          mkdir -p app/src/main/assets app/src/main/res/values app/src/main/java/com/example/wayblur

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "WayBlur"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.9.1" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.wayblur"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.wayblur"
                  minSdk = 33
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              compileOnly("de.robv.android.xposed:api:82")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:label="@string/app_name"
                  android:supportsRtl="true">

                  <meta-data android:name="xposedmodule" android:value="true" />
                  <meta-data android:name="xposeddescription"
                      android:value="WayBlur: One UI 8.5+ alt bar için refraksiyonlu cam efekti" />
                  <meta-data android:name="xposedminversion" android:value="93" />
                  <meta-data android:name="xposedscope" android:resource="@array/xposedscope" />

                  <activity
                      android:name=".SettingsActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name=".SettingsProvider"
                      android:authorities="com.example.wayblur.prefs"
                      android:exported="true" />
              </application>
          </manifest>
          EOF

          printf 'com.example.wayblur.MainHook\n' > app/src/main/assets/xposed_init

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">WayBlur</string>
          </resources>
          EOF

          cat > app/src/main/res/values/arrays.xml <<'EOF'
          <resources>
              <string-array name="xposedscope">
                  <item>com.android.systemui</item>
                  <item>com.sec.android.gallery3d</item>
                  <item>com.samsung.android.dialer</item>
                  <item>com.samsung.android.messaging</item>
                  <item>com.android.settings</item>
              </string-array>
          </resources>
          EOF

          D=app/src/main/java/com/example/wayblur

          cat > $D/MainHook.kt <<'EOF'
          package com.example.wayblur

          import android.view.View
          import de.robv.android.xposed.IXposedHookLoadPackage
          import de.robv.android.xposed.XC_LoadPackage
          import de.robv.android.xposed.XC_MethodHook
          import de.robv.android.xposed.XposedHelpers

          class MainHook : IXposedHookLoadPackage {

              override fun handleLoadPackage(lpparam: XC_LoadPackage.LoadPackageParam) {
                  if (lpparam.packageName !in TARGET_PACKAGES) return

                  val hook = object : XC_MethodHook() {
                      override fun afterHookedMethod(param: MethodHookParam) {
                          WayBlur.maybeApply(param.thisObject as View)
                      }
                  }

                  XposedHelpers.findAndHookMethod(View::class.java, "onAttachedToWindow", hook)
                  XposedHelpers.findAndHookMethod(
                      View::class.java, "onSizeChanged",
                      Int::class.javaPrimitiveType, Int::class.javaPrimitiveType,
                      Int::class.javaPrimitiveType, Int::class.javaPrimitiveType,
                      hook
                  )
              }

              companion object {
                  val TARGET_PACKAGES = setOf(
                      "com.android.systemui",
                      "com.sec.android.gallery3d",
                      "com.samsung.android.dialer",
                      "com.samsung.android.messaging",
                      "com.android.settings"
                  )
              }
          }
          EOF

          cat > $D/WayBlur.kt <<'EOF'
          package com.example.wayblur

          import android.view.View

          object WayBlur {

              fun maybeApply(view: View) {
                  if (view.width <= 0 || view.height <= 0 || view.id == View.NO_ID) return

                  val name = try {
                      view.resources.getResourceEntryName(view.id)
                  } catch (_: Throwable) {
                      return
                  }

                  val cfg = WayBlurConfig.load(view.context)

                  if (cfg["enabled"] != "1") {
                      if (view.renderEffect != null) view.setRenderEffect(null)
                      return
                  }

                  val targets = cfg["targets"].orEmpty()
                      .split(',')
                      .map { it.trim() }
                      .filter { it.isNotEmpty() }

                  if (name !in targets) return

                  WayBlurRenderer.apply(view, cfg)
              }
          }
          EOF

          cat > $D/WayBlurRenderer.kt <<'EOF'
          package com.example.wayblur

          import android.graphics.RenderEffect
          import android.graphics.RuntimeShader
          import android.graphics.Shader
          import android.view.View

          object WayBlurRenderer {

              // AGSL: kenar refraksiyonu, köşe ışığı (rim), yayılma (saturasyon), 3D eğim
              private const val AGSL = """
                  uniform shader content;
                  uniform float2 size;
                  uniform float refraction;
                  uniform float radius;
                  uniform float rim;
                  uniform float tilt;
                  uniform float spread;

                  half4 main(float2 coord) {
                      float2 half2d = size * 0.5;
                      float2 p = coord - half2d;
                      float r = min(radius, min(half2d.x, half2d.y));
                      float2 q = abs(p) - (half2d - float2(r));
                      float dist = length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;

                      if (dist > 0.5) { return half4(0.0); }

                      float edge = 1.0 - clamp(-dist / max(r, 1.0), 0.0, 1.0);
                      float2 n = normalize(p + float2(0.0001));

                      float2 sampleAt = coord - n * refraction * edge * edge;
                      half4 col = content.eval(sampleAt);

                      float lum = dot(float3(col.rgb), float3(0.299, 0.587, 0.114));
                      float3 c = mix(float3(lum), float3(col.rgb), 1.0 + spread);

                      float light = max(dot(n, normalize(float2(-0.6, -0.8))), 0.0);
                      float rimMask = 1.0 - smoothstep(0.0, max(r * 0.12, 1.5), abs(dist));
                      c += rim * rimMask * (0.35 + 0.65 * light);

                      c *= 1.0 + tilt * 0.25 * (light - 0.5) * edge;
                      c = clamp(c, 0.0, 1.0);

                      float alpha = col.a * (1.0 - smoothstep(-0.5, 0.5, dist));
                      return half4(half3(c), half(alpha));
                  }
              """

              fun apply(view: View, cfg: Map<String, String>) {
                  val density = view.resources.displayMetrics.density

                  fun f(key: String) = cfg[key]?.toFloatOrNull() ?: 0f

                  val shader = RuntimeShader(AGSL).apply {
                      setFloatUniform("size", view.width.toFloat(), view.height.toFloat())
                      setFloatUniform("refraction", f("refraction") * density)
                      setFloatUniform("radius", f("cornerRadius") * density)
                      setFloatUniform("rim", f("rim") / 100f)
                      setFloatUniform("tilt", f("tilt") / 100f)
                      setFloatUniform("spread", f("spread") / 100f)
                  }

                  val refract = RenderEffect.createRuntimeShaderEffect(shader, "content")
                  val blur = RenderEffect.createBlurEffect(
                      f("blur") * density, f("blur") * density, Shader.TileMode.CLAMP
                  )

                  // Önce blur, sonra refraksiyon/cam shader'ı
                  view.setRenderEffect(RenderEffect.createChainEffect(refract, blur))
              }
          }
          EOF

          cat > $D/WayBlurConfig.kt <<'EOF'
          package com.example.wayblur

          import android.content.Context
          import android.net.Uri
          import android.os.SystemClock

          object WayBlurConfig {
              const val AUTHORITY = "com.example.wayblur.prefs"
              const val FILE = "wayblur_prefs"

              val DEFAULTS = mapOf(
                  "enabled" to "1",
                  "blur" to "24",
                  "refraction" to "30",
                  "spread" to "40",
                  "cornerRadius" to "28",
                  "rim" to "60",
                  "tilt" to "30",
                  "targets" to "navigation_bar,bottom_navigation,bottom_bar,sesl_bottom_navigation"
              )

              private var cache: Map<String, String> = DEFAULTS
              private var lastLoad = 0L

              // Modül uygulamasının ContentProvider'ından ayarları okur (1 sn önbellek)
              fun load(ctx: Context): Map<String, String> {
                  val now = SystemClock.elapsedRealtime()
                  if (now - lastLoad < 1000) return cache
                  lastLoad = now

                  try {
                      ctx.contentResolver.query(
                          Uri.parse("content://$AUTHORITY/all"), null, null, null, null
                      )?.use { c ->
                          val m = HashMap(DEFAULTS)
                          while (c.moveToNext()) m[c.getString(0)] = c.getString(1)
                          cache = m
                      }
                  } catch (_: Throwable) {
                      // Erişilemezse son bilinen / varsayılan değerler kullanılır
                  }
                  return cache
              }
          }
          EOF

          cat > $D/SettingsProvider.kt <<'EOF'
          package com.example.wayblur

          import android.content.ContentProvider
          import android.content.ContentValues
          import android.content.Context
          import android.database.Cursor
          import android.database.MatrixCursor
          import android.net.Uri

          class SettingsProvider : ContentProvider() {

              override fun onCreate() = true

              override fun query(
                  uri: Uri,
                  projection: Array<out String>?,
                  selection: String?,
                  selectionArgs: Array<out String>?,
                  sortOrder: String?
              ): Cursor {
                  val prefs = context!!.getSharedPreferences(WayBlurConfig.FILE, Context.MODE_PRIVATE)
                  val cursor = MatrixCursor(arrayOf("key", "value"))
                  for ((k, v) in prefs.all) cursor.addRow(arrayOf(k, v.toString()))
                  return cursor
              }

              override fun insert(uri: Uri, values: ContentValues?): Uri? = null
              override fun delete(uri: Uri, selection: String?, selectionArgs: Array<out String>?) = 0
              override fun update(uri: Uri, values: ContentValues?, selection: String?, selectionArgs: Array<out String>?) = 0
              override fun getType(uri: Uri): String? = null
          }
          EOF

          cat > $D/SettingsActivity.kt <<'EOF'
          package com.example.wayblur

          import android.app.Activity
          import android.os.Bundle
          import android.widget.*

          class SettingsActivity : Activity() {

              private val prefs by lazy { getSharedPreferences(WayBlurConfig.FILE, MODE_PRIVATE) }
              private lateinit var targetsField: EditText

              private val sliderRanges = linkedMapOf(
                  "blur" to 60,
                  "refraction" to 80,
                  "spread" to 100,
                  "cornerRadius" to 60,
                  "rim" to 100,
                  "tilt" to 100
              )

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 48, 48, 48)
                  }

                  root.addView(Switch(this).apply {
                      text = "Modülü etkinleştir"
                      isChecked = get("enabled") == "1"
                      setOnCheckedChangeListener { _, on -> put("enabled", if (on) "1" else "0") }
                  })

                  for ((key, maxValue) in sliderRanges) {
                      val label = TextView(this).apply { text = "$key: ${get(key)}" }
                      root.addView(label)
                      root.addView(SeekBar(this).apply {
                          max = maxValue
                          progress = get(key).toInt()
                          setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                              override fun onProgressChanged(sb: SeekBar?, p: Int, fromUser: Boolean) {
                                  label.text = "$key: $p"
                                  if (fromUser) put(key, p.toString())
                              }
                              override fun onStartTrackingTouch(sb: SeekBar?) {}
                              override fun onStopTrackingTouch(sb: SeekBar?) {}
                          })
                      })
                  }

                  root.addView(TextView(this).apply { text = "Hedef view ID'leri (virgülle ayır)" })
                  targetsField = EditText(this).apply { setText(get("targets")) }
                  root.addView(targetsField)

                  setContentView(ScrollView(this).apply { addView(root) })
              }

              override fun onPause() {
                  super.onPause()
                  put("targets", targetsField.text.toString())
              }

              private fun get(key: String): String =
                  prefs.getString(key, WayBlurConfig.DEFAULTS[key]) ?: WayBlurConfig.DEFAULTS.getValue(key)

              private fun put(key: String, value: String) {
                  prefs.edit().putString(key, value).apply()
              }
          }
          EOF

          echo "Proje dosyaları oluşturuldu:"
          find . -type f | sort

      - name: Build release APK
        run: |
          cd "$RUNNER_TEMP/WayBlur"
          gradle :app:assembleRelease --no-daemon

      - name: Rename APK
        run: |
          PROJECT_DIR="$RUNNER_TEMP/WayBlur"
          APK=$(ls "$PROJECT_DIR"/app/build/outputs/apk/release/*.apk | head -n1)
          OUT="WayBlur-${VERSION}.apk"
          cp "$APK" "$GITHUB_WORKSPACE/$OUT"
          echo "APK_NAME=$OUT" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WayBlur
          path: ${{ github.workspace }}/${{ env.APK_NAME }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
          generate_release_notes: true
