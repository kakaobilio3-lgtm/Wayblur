                  XposedBridge.hookAllMethods(Canvas.class, "drawBitmap", new XC_MethodHook() {
                      @Override
                      protected void beforeHookedMethod(MethodHookParam p) {
                          if (!GlassBar.capturing() || p.args.length == 0 || !(p.args[0] instanceof Bitmap)) return;
                          Bitmap bm = (Bitmap) p.args[0];
                          if (bm.getConfig() != Bitmap.Config.HARDWARE) return;
                          Bitmap sw = swCopy(bm);
                          if (sw == null) p.setResult(null);
                          else p.args[0] = sw;
                      }
                  });
              }

              static Bitmap swCopy(Bitmap hw) {
                  Bitmap c = SW.get(hw);
                  if (c != null) return c;
                  if (hw.getAllocationByteCount() > 4 * 1024 * 1024) return null;
                  try {
                      c = hw.copy(Bitmap.Config.ARGB_8888, false);
                  } catch (Throwable t) {
                      c = null;
                  }
                  if (c != null) SW.put(hw, c);
                  return c;
              }

              void onAttach(View v) {
                  if (!(v instanceof ViewGroup) || GlassBar.isGlass(v)) return;
                  long now = SystemClock.uptimeMillis();
                  if (now - lastRefresh > 2000) {
                      lastRefresh = now;
                      refresher.refresh(cfg);
                  }
                  if (!cfg.enabled || !cfg.appEnabled(pkg)) return;
                  if (cacheRev != cfg.rev) {
                      classCache.clear();
                      idCache.clear();
                      cacheRev = cfg.rev;
                  }
                  if (!matches(v)) return;
                  if (GlassBar.hasGlassAncestor(v)) return;
                  if (!GlassConfig.versionOk(cfg)) return;
                  XposedBridge.log("GlassBar: eslesti " + v.getClass().getName() + " id=" + idName(v));
                  GlassBar.attach(v, cfg, refresher, systemUi);
              }

              boolean matches(View v) {
                  Class<?> k = v.getClass();
                  Boolean b = classCache.get(k);
                  if (b == null) {
                      b = classMatches(k);
                      classCache.put(k, b);
                  }
                  if (b) return true;
                  int id = v.getId();
                  if (id != View.NO_ID && id > 0) {
                      Boolean ib = idCache.get(id);
                      if (ib == null) {
                          ib = idMatches(v);
                          idCache.put(id, ib);
                      }
                      return ib;
                  }
                  return false;
              }

              boolean classMatches(Class<?> k) {
                  if (hasAny(simple(k), EXCL)) return false;
                  for (Class<?> c = k; c != null && c != ViewGroup.class && c != View.class && c != Object.class;
                       c = c.getSuperclass()) {
                      String full = c.getName().toLowerCase(Locale.ROOT);
                      if (full.startsWith("android.")) break;
                      String s = simple(c);
                      if (hasAny(s, CLS)) return true;
                      if (systemUi && s.equals("navigationbarview")) return true;
                      for (String t : cfg.customTokens) if (full.contains(t)) return true;
                  }
                  return false;
              }

              boolean idMatches(View v) {
                  String n = idName(v);
                  if (n == null) return false;
                  n = n.toLowerCase(Locale.ROOT);
                  if (hasAny(n, EXCL)) return false;
                  if (hasAny(n, IDS)) return true;
                  for (String t : cfg.customTokens) if (n.contains(t)) return true;
                  return false;
              }

              static String idName(View v) {
                  try {
                      return v.getResources().getResourceEntryName(v.getId());
                  } catch (Throwable t) {
                      return null;
                  }
              }

              static String simple(Class<?> c) {
                  String n = c.getName();
                  return n.substring(n.lastIndexOf('.') + 1).toLowerCase(Locale.ROOT);
              }

              static boolean hasAny(String s, String[] toks) {
                  for (String t : toks) if (s.contains(t)) return true;
                  return false;
              }
          }
