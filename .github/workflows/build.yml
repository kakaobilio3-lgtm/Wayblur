# Glass Bar - One UI 8.5+ refraction cam alt bar (LSPosed modulu)
# Kullanim: bu dosyayi reponuzda .github/workflows/build.yml olarak kaydedin.
#  - Release icin: git tag v1.0.0 && git push origin v1.0.0   (veya Actions > Run workflow)
#  - Sabit imza icin (guncellemelerin ustune kurulabilmesi) repo Secrets:
#      KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS   (store ve key sifresi ayni olmali)
#    Secret yoksa her build'de gecici bir anahtar uretilir.
name: Build & Release Glass Bar

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release etiketi (orn. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Proje dosyalarini olustur
        run: |
          mkdir -p module
          cd module
          mkdir -p app
          cat > app/build.gradle <<'GLASS_EOF_7731'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'io.github.glassbar'
              compileSdk 35

              defaultConfig {
                  applicationId 'io.github.glassbar'
                  minSdk 33
                  targetSdk 34
                  versionCode (project.findProperty('verCode') ?: '1').toInteger()
                  versionName (project.findProperty('verName') ?: '1.0')
              }

              signingConfigs {
                  release {
                      if (System.getenv('KS_FILE')) {
                          storeFile file(System.getenv('KS_FILE'))
                          storePassword System.getenv('KS_PASS')
                          keyAlias System.getenv('KS_ALIAS')
                          keyPassword System.getenv('KS_PASS')
                      }
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }

          dependencies {
              compileOnly 'de.robv.android.xposed:api:82'
          }
          GLASS_EOF_7731
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'GLASS_EOF_7731'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Glass Bar"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.DeviceDefault.DayNight">

                  <meta-data android:name="xposedmodule" android:value="true" />
                  <meta-data android:name="xposeddescription" android:value="One UI 8.5+ alt bar icin refraction cam efekti" />
                  <meta-data android:name="xposedminversion" android:value="93" />
                  <meta-data android:name="xposedsharedprefs" android:value="true" />
                  <meta-data android:name="xposedscope" android:resource="@array/xposed_scope" />

                  <activity
                      android:name=".SettingsActivity"
                      android:exported="true"
                      android:label="Glass Bar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          GLASS_EOF_7731
          mkdir -p app/src/main/assets
          cat > app/src/main/assets/xposed_init <<'GLASS_EOF_7731'
          io.github.glassbar.MainHook
          GLASS_EOF_7731
          mkdir -p app/src/main/java/io/github/glassbar
          cat > app/src/main/java/io/github/glassbar/GlassBar.java <<'GLASS_EOF_7731'
          package io.github.glassbar;

          import android.content.res.Configuration;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.ColorFilter;
          import android.graphics.Color;
          import android.graphics.Outline;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.PixelFormat;
          import android.graphics.Rect;
          import android.graphics.RectF;
          import android.graphics.RecordingCanvas;
          import android.graphics.RenderEffect;
          import android.graphics.RenderNode;
          import android.graphics.RuntimeShader;
          import android.graphics.Shader;
          import android.graphics.drawable.Drawable;
          import android.os.SystemClock;
          import android.util.Log;
          import android.view.View;
          import android.view.ViewOutlineProvider;
          import android.view.ViewParent;
          import android.view.ViewTreeObserver;

          import java.lang.reflect.Method;
          import java.util.Arrays;
          import java.util.Collections;
          import java.util.Map;
          import java.util.WeakHashMap;

          /**
           * Bir View'in arkaplanini "refraction'lu cam" yapar.
           * Arka plan: decor view yazilim canvas'ina (1/4 olcek) cizilir, RenderNode + RenderEffect ile
           * blur + kirilma (AGSL) uygulanir, ustune tam cozunurluklu isik/3D katmani cizilir.
           */
          public final class GlassBar implements ViewTreeObserver.OnPreDrawListener, View.OnAttachStateChangeListener {

              public interface Refresher {
                  boolean refresh(GlassConfig cfg);
              }

              static final String TAG = "GlassBar";
              static final int DS = 4;

              static final String AGSL_BACKDROP = """
                      uniform shader image;
                      uniform float2 size;
                      uniform float radius;
                      uniform float spread;
                      uniform float refr;
                      uniform float disp;
                      uniform float4 tint;

                      float sdRR(float2 p, float2 b, float r) {
                          float2 q = abs(p) - b + float2(r);
                          return min(max(q.x, q.y), 0.0) + length(max(q, float2(0.0))) - r;
                      }
                      float2 nrm(float2 p, float2 b, float r) {
                          float2 g = float2(
                              sdRR(p + float2(1.0, 0.0), b, r) - sdRR(p - float2(1.0, 0.0), b, r),
                              sdRR(p + float2(0.0, 1.0), b, r) - sdRR(p - float2(0.0, 1.0), b, r));
                          float l = length(g);
                          if (l < 0.0001) { return float2(0.0, -1.0); }
                          return g / l;
                      }
                      half4 main(float2 fc) {
                          float2 c = size * 0.5;
                          float2 p = fc - c;
                          float d = max(-sdRR(p, c, radius), 0.0);
                          float t = clamp(d / max(spread, 1.0), 0.0, 1.0);
                          float prof = 1.0 - sqrt(max(1.0 - (1.0 - t) * (1.0 - t), 0.0));
                          float2 n = nrm(p, c, radius);
                          float2 off = n * (refr * prof);
                          float2 lo = float2(0.5);
                          float2 hi = size - float2(0.5);
                          float2 uR = clamp(fc - off * (1.0 - disp), lo, hi);
                          float2 uG = clamp(fc - off, lo, hi);
                          float2 uB = clamp(fc - off * (1.0 + disp), lo, hi);
                          float3 rgb = float3(image.eval(uR).r, image.eval(uG).g, image.eval(uB).b);
                          float l = dot(rgb, float3(0.299, 0.587, 0.114));
                          rgb = mix(float3(l), rgb, 1.2);
                          rgb = mix(rgb, tint.rgb, tint.a);
                          return half4(half(rgb.r), half(rgb.g), half(rgb.b), 1.0);
                      }
                      """;

              static final String AGSL_LIGHT = """
                      uniform float2 size;
                      uniform float radius;
                      uniform float spread;
                      uniform float rim;
                      uniform float cglow;
                      uniform float depth;

                      float sdRR(float2 p, float2 b, float r) {
                          float2 q = abs(p) - b + float2(r);
                          return min(max(q.x, q.y), 0.0) + length(max(q, float2(0.0))) - r;
                      }
                      float2 nrm(float2 p, float2 b, float r) {
                          float2 g = float2(
                              sdRR(p + float2(1.0, 0.0), b, r) - sdRR(p - float2(1.0, 0.0), b, r),
                              sdRR(p + float2(0.0, 1.0), b, r) - sdRR(p - float2(0.0, 1.0), b, r));
                          float l = length(g);
                          if (l < 0.0001) { return float2(0.0, -1.0); }
                          return g / l;
                      }
                      half4 main(float2 fc) {
                          float2 c = size * 0.5;
                          float2 p = fc - c;
                          float d = max(-sdRR(p, c, radius), 0.0);
                          float2 n = nrm(p, c, radius);
                          float edge = exp(-d / max(1.5, spread * 0.12));
                          float wide = exp(-d / max(2.0, spread * 0.6));
                          float2 L = normalize(float2(-0.55, -0.83));
                          float l1 = max(dot(n, L), 0.0);
                          float l2 = max(dot(n, -L), 0.0);
                          float spec = pow(l1, 2.0) + 0.55 * pow(l2, 2.0);
                          float2 q = abs(p) - (c - float2(radius));
                          float cw = smoothstep(-radius * 0.5, radius * 0.35, min(q.x, q.y));
                          float cornerSpec = cw * (pow(l1, 1.5) + 0.7 * pow(l2, 1.5));
                          float border = 1.0 - smoothstep(0.0, 1.6, d);
                          float a1 = rim * (0.50 * edge * spec + cglow * 1.1 * edge * cornerSpec
                                            + 0.22 * border + 0.10 * wide * l1);
                          float ty = fc.y / size.y;
                          float up = clamp(-n.y, 0.0, 1.0);
                          float dn = clamp(n.y, 0.0, 1.0);
                          float bev = exp(-d / max(2.0, spread * 0.45));
                          a1 += depth * (0.10 * (1.0 - ty) + 0.30 * bev * up);
                          float a2 = depth * (0.22 * smoothstep(0.5, 1.0, ty) + 0.32 * bev * dn);
                          a1 = clamp(a1, 0.0, 0.95);
                          a2 = clamp(a2, 0.0, 0.6);
                          float a = a1 + a2 * (1.0 - a1);
                          return half4(half(a1), half(a1), half(a1), half(a));
                      }
                      """;

              static final Map<View, GlassBar> BARS = Collections.synchronizedMap(new WeakHashMap<View, GlassBar>());
              static View sCapturing;

              // ---------- statik yardimcilar (hook'lar kullanir) ----------

              public static boolean skip(View child) {
                  return child != null && child == sCapturing;
              }

              public static boolean capturing() {
                  return sCapturing != null;
              }

              public static boolean isGlass(View v) {
                  return BARS.containsKey(v);
              }

              public static boolean blocks(View v, Drawable d) {
                  GlassBar g = BARS.get(v);
                  return g != null && g.installed && !g.installing && d != g.glass;
              }

              public static boolean hasGlassAncestor(View v) {
                  ViewParent p = v.getParent();
                  while (p != null) {
                      if (p instanceof View && BARS.containsKey(p)) return true;
                      p = p.getParent();
                  }
                  return false;
              }

              public static GlassBar attach(View bar, GlassConfig cfg, Refresher r, boolean windowMode) {
                  GlassBar g = BARS.get(bar);
                  if (g != null) return g;
                  g = new GlassBar(bar, cfg, r, windowMode);
                  BARS.put(bar, g);
                  g.install();
                  return g;
              }

              // ---------- ornek durumu ----------

              final View bar;
              final GlassConfig cfg;
              final Refresher refresher;
              final boolean windowMode;
              final float density;
              final RenderNode node = new RenderNode("GlassBackdrop");
              final Glass glass = new Glass();
              final Path path = new Path();
              final RectF rf = new RectF();
              final Paint tintPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
              final int[] la = new int[2], lb = new int[2];

              Paint lightPaint;
              Drawable origBg, blurDrawable;
              ViewOutlineProvider origOutline;
              boolean origClip;
              ViewTreeObserver vto;
              boolean installed, installing, forceRecord = true;
              int appliedRev = -1, lastW, lastH, lw = 1, lh = 1, hash;
              long lastRefresh;
              Bitmap bmp;
              Canvas bmpCanvas;
              int[] px;

              final ViewOutlineProvider glassOutline = new ViewOutlineProvider() {
                  @Override
                  public void getOutline(View v, Outline o) {
                      float r = Math.min(cfg.cornerDp * density, Math.min(v.getWidth(), v.getHeight()) / 2f);
                      o.setRoundRect(0, 0, v.getWidth(), v.getHeight(), r);
                  }
              };

              private GlassBar(View bar, GlassConfig cfg, Refresher r, boolean windowMode) {
                  this.bar = bar;
                  this.cfg = cfg;
                  this.refresher = r;
                  this.windowMode = windowMode;
                  this.density = bar.getResources().getDisplayMetrics().density;
              }

              private void install() {
                  origBg = bar.getBackground();
                  origOutline = bar.getOutlineProvider();
                  origClip = bar.getClipToOutline();
                  setInstalled(true);
                  bar.addOnAttachStateChangeListener(this);
                  if (bar.isAttachedToWindow()) onViewAttachedToWindow(bar);
              }

              private void setInstalled(boolean on) {
                  if (on == installed) return;
                  installed = on;
                  installing = true;
                  try {
                      bar.setBackground(on ? glass : origBg);
                  } finally {
                      installing = false;
                  }
                  bar.setOutlineProvider(on ? glassOutline : origOutline);
                  bar.setClipToOutline(on || origClip);
              }

              @Override
              public void onViewAttachedToWindow(View v) {
                  ViewTreeObserver now = bar.getViewTreeObserver();
                  if (vto == now && now.isAlive()) return;
                  vto = now;
                  vto.addOnPreDrawListener(this);
                  if (windowMode) initWindowBlur();
                  forceRecord = true;
                  bar.invalidate();
              }

              @Override
              public void onViewDetachedFromWindow(View v) {
                  if (vto != null && vto.isAlive()) vto.removeOnPreDrawListener(this);
                  vto = null;
                  blurDrawable = null;
              }

              @Override
              public boolean onPreDraw() {
                  try {
                      step();
                  } catch (Throwable t) {
                      if (cfg.debug) Log.e(TAG, "step", t);
                  }
                  return true;
              }

              private void step() {
                  long now = SystemClock.uptimeMillis();
                  if (refresher != null && now - lastRefresh > 1500) {
                      lastRefresh = now;
                      refresher.refresh(cfg);
                  }
                  if (!cfg.enabled) {
                      setInstalled(false);
                      return;
                  }
                  setInstalled(true);
                  int w = bar.getWidth(), h = bar.getHeight();
                  if (w <= 0 || h <= 0 || bar.getVisibility() != View.VISIBLE) return;
                  if (cfg.rev != appliedRev || w != lastW || h != lastH) rebuild(w, h);
                  if (!windowMode) capture(w, h);
              }

              private boolean isDark() {
                  if (cfg.tintMode == 1) return false;
                  if (cfg.tintMode == 2) return true;
                  int m = bar.getResources().getConfiguration().uiMode & Configuration.UI_MODE_NIGHT_MASK;
                  return m == Configuration.UI_MODE_NIGHT_YES;
              }

              private void rebuild(int w, int h) {
                  appliedRev = cfg.rev;
                  lastW = w;
                  lastH = h;
                  float corner = Math.min(cfg.cornerDp * density, Math.min(w, h) / 2f);
                  float spread = Math.max(2f, cfg.spreadDp * density);
                  float[] t = isDark() ? new float[]{0.06f, 0.06f, 0.08f} : new float[]{1f, 1f, 1f};
                  float tintA = cfg.tintPct / 100f;

                  float winA = Math.min(1f, tintA + 0.10f);
                  tintPaint.setColor(Color.argb(Math.round((windowMode ? winA : tintA) * 255f),
                          Math.round(t[0] * 255f), Math.round(t[1] * 255f), Math.round(t[2] * 255f)));

                  if (!windowMode) {
                      int nlw = Math.max(1, Math.round(w / (float) DS));
                      int nlh = Math.max(1, Math.round(h / (float) DS));
                      if (bmp == null || nlw != lw || nlh != lh) {
                          lw = nlw;
                          lh = nlh;
                          bmp = Bitmap.createBitmap(lw, lh, Bitmap.Config.ARGB_8888);
                          bmpCanvas = new Canvas(bmp);
                          px = new int[lw * lh];
                      }
                      float k = lw / (float) w;
                      RuntimeShader s = new RuntimeShader(AGSL_BACKDROP);
                      s.setFloatUniform("size", (float) lw, (float) lh);
                      s.setFloatUniform("radius", corner * k);
                      s.setFloatUniform("spread", spread * k);
                      s.setFloatUniform("refr", cfg.refractionDp * density * k);
                      s.setFloatUniform("disp", cfg.dispersionPct / 100f);
                      s.setFloatUniform("tint", t[0], t[1], t[2], tintA);
                      RenderEffect e = RenderEffect.createRuntimeShaderEffect(s, "image");
                      float sigma = cfg.blurDp * density * k * 0.5f;
                      if (sigma >= 0.25f) {
                          e = RenderEffect.createChainEffect(e,
                                  RenderEffect.createBlurEffect(sigma, sigma, Shader.TileMode.CLAMP));
                      }
                      node.setPosition(0, 0, lw, lh);
                      node.setRenderEffect(e);
                      forceRecord = true;
                  }

                  RuntimeShader ls = new RuntimeShader(AGSL_LIGHT);
                  ls.setFloatUniform("size", (float) w, (float) h);
                  ls.setFloatUniform("radius", corner);
                  ls.setFloatUniform("spread", spread);
                  ls.setFloatUniform("rim", cfg.rimPct / 100f);
                  ls.setFloatUniform("cglow", cfg.glowPct / 100f);
                  ls.setFloatUniform("depth", cfg.depthPct / 100f);
                  Paint lp = new Paint(Paint.ANTI_ALIAS_FLAG);
                  lp.setShader(ls);
                  lightPaint = lp;

                  applyBlurParams(corner);
                  bar.invalidateOutline();
                  bar.invalidate();
              }

              private void capture(int w, int h) {
                  View root = bar.getRootView();
                  if (root == null || root == bar || bmp == null) return;
                  bar.getLocationInWindow(la);
                  root.getLocationInWindow(lb);
                  float dx = la[0] - lb[0], dy = la[1] - lb[1];
                  bmp.eraseColor(0);
                  int sv = bmpCanvas.save();
                  sCapturing = bar;
                  try {
                      bmpCanvas.scale(lw / (float) w, lh / (float) h);
                      bmpCanvas.translate(-dx, -dy);
                      bmpCanvas.clipRect(dx, dy, dx + w, dy + h);
                      root.draw(bmpCanvas);
                  } catch (Throwable t) {
                      if (cfg.debug) Log.w(TAG, "capture", t);
                  } finally {
                      sCapturing = null;
                      bmpCanvas.restoreToCount(sv);
                  }
                  bmp.getPixels(px, 0, lw, 0, 0, lw, lh);
                  int hh = Arrays.hashCode(px);
                  if (hh != hash || forceRecord) {
                      hash = hh;
                      forceRecord = false;
                      RecordingCanvas rc = node.beginRecording(lw, lh);
                      rc.drawBitmap(bmp, 0f, 0f, null);
                      node.endRecording();
                  }
              }

              // ---------- SystemUI icin pencere-blur'u (gizli API) ----------

              private void initWindowBlur() {
                  try {
                      Object vri = View.class.getMethod("getViewRootImpl").invoke(bar);
                      if (vri == null) return;
                      Method m = vri.getClass().getMethod("createBackgroundBlurDrawable");
                      blurDrawable = (Drawable) m.invoke(vri);
                      appliedRev = -1;
                  } catch (Throwable t) {
                      Log.w(TAG, "window blur yok: " + t);
                  }
              }

              private void applyBlurParams(float corner) {
                  if (blurDrawable == null) return;
                  try {
                      Class<?> k = blurDrawable.getClass();
                      k.getMethod("setBlurRadius", int.class).invoke(blurDrawable, Math.round(cfg.blurDp * density));
                      k.getMethod("setCornerRadius", float.class).invoke(blurDrawable, corner);
                  } catch (Throwable t) {
                      Log.w(TAG, "blur params: " + t);
                  }
              }

              // ---------- arkaplan drawable'i ----------

              private final class Glass extends Drawable {
                  @Override
                  public void draw(Canvas c) {
                      Rect b = getBounds();
                      int w = b.width(), h = b.height();
                      if (w <= 0 || h <= 0) return;
                      float rad = Math.min(cfg.cornerDp * density, Math.min(w, h) / 2f);
                      rf.set(0, 0, w, h);
                      path.reset();
                      path.addRoundRect(rf, rad, rad, Path.Direction.CW);
                      int sv = c.save();
                      c.translate(b.left, b.top);
                      c.clipPath(path);
                      boolean hw = c.isHardwareAccelerated() && c instanceof RecordingCanvas;
                      if (windowMode) {
                          if (blurDrawable != null) {
                              blurDrawable.setBounds(0, 0, w, h);
                              blurDrawable.draw(c);
                          }
                          c.drawRect(rf, tintPaint);
                      } else if (hw && bmp != null) {
                          int s2 = c.save();
                          c.scale(w / (float) lw, h / (float) lh);
                          ((RecordingCanvas) c).drawRenderNode(node);
                          c.restoreToCount(s2);
                      } else {
                          c.drawRect(rf, tintPaint);
                      }
                      if (lightPaint != null) c.drawRect(rf, lightPaint);
                      c.restoreToCount(sv);
                  }

                  @Override
                  public void setAlpha(int alpha) {
                  }

                  @Override
                  public void setColorFilter(ColorFilter cf) {
                  }

                  @Override
                  public int getOpacity() {
                      return PixelFormat.TRANSLUCENT;
                  }
              }
          }
          GLASS_EOF_7731
          mkdir -p app/src/main/java/io/github/glassbar
          cat > app/src/main/java/io/github/glassbar/GlassConfig.java <<'GLASS_EOF_7731'
          package io.github.glassbar;

          import android.content.SharedPreferences;
          import android.os.Build;

          import java.util.Locale;

          public class GlassConfig {
              public static final String PREFS = "glass_prefs";
              public static final String PKG_SYSTEMUI = "com.android.systemui";
              public static final String[] PKGS = {
                      "com.android.systemui", "com.sec.android.gallery3d", "com.samsung.android.dialer",
                      "com.samsung.android.messaging", "com.android.settings"};

              public int rev;
              public boolean enabled = true, ignoreVersion = false, debug = false;
              public boolean appSystemUi = true, appGallery = true, appPhone = true, appMessages = true, appSettings = true;
              public float blurDp = 16f, refractionDp = 12f, spreadDp = 22f, dispersionPct = 10f, cornerDp = 26f,
                      rimPct = 70f, glowPct = 80f, depthPct = 60f, tintPct = 16f;
              public int tintMode = 0; // 0 otomatik, 1 acik, 2 koyu
              public String custom = "";
              public String[] customTokens = new String[0];

              public synchronized void load(SharedPreferences p) {
                  enabled = p.getBoolean("enabled", true);
                  ignoreVersion = p.getBoolean("ignoreVersion", false);
                  debug = p.getBoolean("debug", false);
                  appSystemUi = p.getBoolean("appSystemUi", true);
                  appGallery = p.getBoolean("appGallery", true);
                  appPhone = p.getBoolean("appPhone", true);
                  appMessages = p.getBoolean("appMessages", true);
                  appSettings = p.getBoolean("appSettings", true);
                  blurDp = p.getFloat("blurDp", 16f);
                  refractionDp = p.getFloat("refractionDp", 12f);
                  spreadDp = p.getFloat("spreadDp", 22f);
                  dispersionPct = p.getFloat("dispersionPct", 10f);
                  cornerDp = p.getFloat("cornerDp", 26f);
                  rimPct = p.getFloat("rimPct", 70f);
                  glowPct = p.getFloat("glowPct", 80f);
                  depthPct = p.getFloat("depthPct", 60f);
                  tintPct = p.getFloat("tintPct", 16f);
                  tintMode = p.getInt("tintMode", 0);
                  custom = p.getString("custom", "");
                  String c = custom == null ? "" : custom.toLowerCase(Locale.ROOT).trim();
                  customTokens = c.isEmpty() ? new String[0] : c.split("[,;\\s]+");
                  rev++;
              }

              public boolean appEnabled(String pkg) {
                  if ("com.android.systemui".equals(pkg)) return appSystemUi;
                  if ("com.sec.android.gallery3d".equals(pkg)) return appGallery;
                  if ("com.samsung.android.dialer".equals(pkg)) return appPhone;
                  if ("com.samsung.android.messaging".equals(pkg)) return appMessages;
                  if ("com.android.settings".equals(pkg)) return appSettings;
                  return false;
