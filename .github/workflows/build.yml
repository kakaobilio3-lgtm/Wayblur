          package io.github.glassbar;

          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.drawable.Drawable;
          import android.os.Build;
          import android.os.SystemClock;
          import android.view.View;
          import android.view.ViewGroup;

          import java.util.Collections;
          import java.util.HashMap;
          import java.util.Locale;
          import java.util.Map;
          import java.util.WeakHashMap;

          import de.robv.android.xposed.IXposedHookLoadPackage;
          import de.robv.android.xposed.XC_MethodHook;
          import de.robv.android.xposed.XSharedPreferences;
          import de.robv.android.xposed.XposedBridge;
          import de.robv.android.xposed.XposedHelpers;
          import de.robv.android.xposed.callbacks.XC_LoadPackage.LoadPackageParam;

          public class MainHook implements IXposedHookLoadPackage {
              static final String MODULE = "io.github.glassbar";

              // Sinif adi (kucuk harf, basit ad) eslesmeleri
              static final String[] CLS = {"bottomnavigationview", "bottomnavview", "bottomnavigationbar",
                      "bottomnavbar", "bottombar", "bottomtab", "bottomnavigation", "bottomnav"};
              // Resource id adi eslesmeleri
              static final String[] IDS = {"bottom_nav", "bottom_tab", "bottom_bar", "bottomnav",
                      "bottom_navigation", "navigation_bottom"};
              // Bar'in ic parcalarini elemek icin
              static final String[] EXCL = {"menu", "item", "indicator", "badge", "label", "icon", "text",
                      "button", "divider", "shadow", "behavior"};

              static final Map<Bitmap, Bitmap> SW = Collections.synchronizedMap(new WeakHashMap<Bitmap, Bitmap>());

              final GlassConfig cfg = new GlassConfig();
              final Map<Class<?>, Boolean> classCache = new HashMap<>();
              final Map<Integer, Boolean> idCache = new HashMap<>();
              XSharedPreferences prefs;
              String pkg;
              boolean systemUi;
              int cacheRev = -1;
              long lastRefresh;

              final GlassBar.Refresher refresher = new GlassBar.Refresher() {
                  @Override
                  public boolean refresh(GlassConfig c) {
                      try {
                          if (prefs != null && prefs.hasFileChanged()) {
                              prefs.reload();
                              c.load(prefs);
                              return true;
                          }
                      } catch (Throwable ignored) {
                      }
                      return false;
                  }
              };

              @Override
              public void handleLoadPackage(LoadPackageParam lp) {
                  pkg = lp.packageName;
                  if (!GlassConfig.isTarget(pkg)) return;
                  if (Build.VERSION.SDK_INT < 33) return;
                  systemUi = GlassConfig.PKG_SYSTEMUI.equals(pkg);

                  prefs = new XSharedPreferences(MODULE, GlassConfig.PREFS);
                  prefs.makeWorldReadable();
                  cfg.load(prefs);
                  XposedBridge.log("GlassBar: " + pkg + " yuklendi, oneui=" + GlassConfig.oneUi()
                          + ", enabled=" + cfg.enabled);

                  // 1) Bar'i bul ve camlastir
                  XposedHelpers.findAndHookMethod(View.class, "onAttachedToWindow", new XC_MethodHook() {
                      @Override
                      protected void afterHookedMethod(MethodHookParam p) {
                          try {
                              onAttach((View) p.thisObject);
                          } catch (Throwable t) {
                              XposedBridge.log("GlassBar onAttach: " + t);
                          }
                      }
                  });

                  // 2) Uygulama arkaplani geri yazmasin
                  XposedHelpers.findAndHookMethod(View.class, "setBackgroundDrawable", Drawable.class, new XC_MethodHook() {
                      @Override
                      protected void beforeHookedMethod(MethodHookParam p) {
                          if (GlassBar.blocks((View) p.thisObject, (Drawable) p.args[0])) p.setResult(null);
                      }
                  });

                  // 3) Arkaplan yakalarken bar'in kendisini cizme
                  XposedHelpers.findAndHookMethod(ViewGroup.class, "drawChild",
                          Canvas.class, View.class, long.class, new XC_MethodHook() {
                              @Override
                              protected void beforeHookedMethod(MethodHookParam p) {
                                  if (GlassBar.skip((View) p.args[1])) p.setResult(false);
                              }
                          });

