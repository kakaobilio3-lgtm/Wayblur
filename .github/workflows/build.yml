              /** 80500 gibi bir deger doner (One UI 8.5). Okunamazsa 0. */
              public static synchronized int oneUi() {
                  if (sOneUi != Integer.MIN_VALUE) return sOneUi;
                  int r = 0;
                  try {
                      Class<?> sp = Class.forName("android.os.SystemProperties");
                      String s = (String) sp.getMethod("get", String.class, String.class)
                              .invoke(null, "ro.build.version.oneui", "");
                      if (s != null && !s.trim().isEmpty()) r = Integer.parseInt(s.trim());
                  } catch (Throwable ignored) {
                  }
                  if (r == 0) {
                      try {
                          int sem = Build.VERSION.class.getField("SEM_PLATFORM_INT").getInt(null);
                          if (sem > 0) r = sem - 90000;
                      } catch (Throwable ignored) {
                      }
                  }
                  sOneUi = r;
                  return r;
              }

              public static boolean versionOk(GlassConfig c) {
                  if (c.ignoreVersion) return true;
                  int v = oneUi();
                  return v <= 0 || v >= 80500;
              }
