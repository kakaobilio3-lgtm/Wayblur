      - name: Keystore hazirla
        working-directory: module
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks
            echo "KS_PASS=$KS_PASS_SECRET" >> "$GITHUB_ENV"
            echo "KS_ALIAS=$KS_ALIAS_SECRET" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 yok, gecici anahtar uretiliyor (guncelleme imzasi her build'de degisir)"
            keytool -genkeypair -keystore release.jks -alias glassbar -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass glassbar123 -keypass glassbar123 -dname "CN=GlassBar"
            echo "KS_PASS=glassbar123" >> "$GITHUB_ENV"
            echo "KS_ALIAS=glassbar" >> "$GITHUB_ENV"
          fi
          echo "KS_FILE=$PWD/release.jks" >> "$GITHUB_ENV"

      - name: Derle
        working-directory: module
        run: |
          VER="${TAG#v}"
          gradle assembleRelease --no-daemon --stacktrace -PverName="$VER" -PverCode="$GITHUB_RUN_NUMBER"
          cp app/build/outputs/apk/release/app-release.apk "GlassBar-${TAG}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: GlassBar-${{ env.TAG }}
          path: module/GlassBar-${{ env.TAG }}.apk

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Glass Bar ${{ env.TAG }}
          files: module/GlassBar-${{ env.TAG }}.apk
          generate_release_notes: true

