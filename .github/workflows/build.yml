# Glass Bar - One UI 8.5+ refraction cam alt bar (LSPosed modulu)
name: Build & Release Glass Bar

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release etiketi (orn. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # DÜZELTME: setup-android@v3 yerine manuel SDK kurulumu
      - name: Android SDK paketlerini kur
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Proje dosyalarini olustur
        run: |
          mkdir -p module
          cd module
          mkdir -p app
          cat > app/build.gradle <<'GLASS_EOF_7731'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'io.github.glassbar'
              compileSdk 35
              buildToolsVersion "35.0.0"

              defaultConfig {
                  applicationId 'io.github.glassbar'
                  minSdk 33
                  targetSdk 34
                  versionCode = Integer.parseInt((project.findProperty('verCode') ?: '1').toString())
                  versionName = (project.findProperty('verName') ?: '1.0').toString()
              }

              signingConfigs {
                  release {
                      if (System.getenv('KS_FILE')) {
                          storeFile file(System.getenv('KS_FILE'))
                          storePassword System.getenv('KS_PASS')
                          keyAlias System.getenv('KS_ALIAS')
                          keyPassword System.getenv('KS_PASS')
                      }
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }

          dependencies {
              compileOnly 'de.robv.android.xposed:api:82'
          }
          GLASS_EOF_7731
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'GLASS_EOF_7731'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Glass Bar"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.DeviceDefault.DayNight">

                  <meta-data android:name="xposedmodule" android:value="true" />
                  <meta-data android:name="xposeddescription" android:value="Refraction glass effect for the One UI 8.5+ bottom bar" />
                  <meta-data android:name="xposedminversion" android:value="93" />
                  <meta-data android:name="xposedsharedprefs" android:value="true" />
                  <meta-data android:name="xposedscope" android:resource="@array/xposed_scope" />

                  <activity
                      android:name=".SettingsActivity"
                      android:exported="true"
                      android:label="Glass Bar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          GLASS_EOF_7731
          mkdir -p app/src/main/assets
          cat > app/src/main/assets/xposed_init <<'GLASS_EOF_7731'
          io.github.glassbar.MainHook
          GLASS_EOF_7731
          mkdir -p app/src/main/java/io/github/glassbar
          cat > app/src/main/java/io/github/glassbar/GlassBar.java <<'GLASS_EOF_7731'
          package io.github.glassbar;

          import android.content.res.Configuration;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.ColorFilter;
          import android.graphics.Color;
          import android.graphics.Outline;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.PixelFormat;
          import android.graphics.Rect;
          import android.graphics.RectF;
          import android.graphics.RecordingCanvas;
          import android.graphics.RenderEffect;
          import android.graphics.RenderNode;
          import android.graphics.RuntimeShader;
          import android.graphics.Shader;
          import android.graphics.drawable.Drawable;
          import android.os.SystemClock;
          import android.util.Log;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewConfiguration;
          import android.view.ViewGroup;
          import android.view.ViewOutlineProvider;
          import android.view.ViewParent;
          import android.view.ViewTreeObserver;

          import java.lang.reflect.Method;
          import java.util.Arrays;
          import java.util.Collections;
          import java.util.Map;
          import java.util.WeakHashMap;

          public final class GlassBar implements ViewTreeObserver.OnPreDrawListener, View.OnAttachStateChangeListener {

              public interface Refresher {
                  boolean refresh(GlassConfig cfg);
              }

              static final String TAG = "GlassBar";
              static final int DS = 4;

              static final String AGSL_BACKDROP = """
                      uniform shader image;
                      uniform float2 size;
                      uniform float radius;
                      uniform float spread;
                      uniform float refr;
                      uniform float disp;
                      uniform float4 tint;
                  uniform float sat;

                      float sdRR(float2 p, float2 b, float r) {
                          float2 q = abs(p) - b + float2(r);
                          return min(max(q.x, q.y), 0.0) + length(max(q, float2(0.0))) - r;
                      }
                      float2 nrm(float2 p, float2 b, float r) {
                          float2 g = float2(
                              sdRR(p + float2(1.0, 0.0), b, r) - sdRR(p - float2(1.0, 0.0), b, r),
                              sdRR(p + float2(0.0, 1.0), b, r) - sdRR(p - float2(0.0, 1.0), b, r));
                          float l = length(g);
                          if (l < 0.0001) { return float2(0.0, -1.0); }
                          return g / l;
                      }
                      half4 main(float2 fc) {
                          float2 c = size * 0.5;
                          float2 p = fc - c;
                          float d = max(-sdRR(p, c, radius), 0.0);
                          float t = clamp(d / max(spread, 1.0), 0.0, 1.0);
                          float prof = 1.0 - sqrt(max(1.0 - (1.0 - t) * (1.0 - t), 0.0));
                          float2 n = nrm(p, c, radius);
                          float2 off = n * (refr * prof);
                          float2 lo = float2(0.5);
                          float2 hi = size - float2(0.5);
                          float2 uR = clamp(fc - off * (1.0 - disp), lo, hi);
                          float2 uG = clamp(fc - off, lo, hi);
                          float2 uB = clamp(fc - off * (1.0 + disp), lo, hi);
                          float3 rgb = float3(image.eval(uR).r, image.eval(uG).g, image.eval(uB).b);
                          float l = dot(rgb, float3(0.299, 0.587, 0.114));
                          rgb = clamp(mix(float3(l), rgb, sat), 0.0, 1.0);
                          rgb = mix(rgb, tint.rgb, tint.a);
                          return half4(half(rgb.r), half(rgb.g), half(rgb.b), 1.0);
                      }
                      """;

              static final String AGSL_LIGHT = """
                      uniform float2 size;
                      uniform float radius;
                      uniform float spread;
                      uniform float rim;
                      uniform float cglow;
                      uniform float depth;

                      float sdRR(float2 p, float2 b, float r) {
                          float2 q = abs(p) - b + float2(r);
                          return min(max(q.x, q.y), 0.0) + length(max(q, float2(0.0))) - r;
                      }
                      float2 nrm(float2 p, float2 b, float r) {
                          float2 g = float2(
                              sdRR(p + float2(1.0, 0.0), b, r) - sdRR(p - float2(1.0, 0.0), b, r),
                              sdRR(p + float2(0.0, 1.0), b, r) - sdRR(p - float2(0.0, 1.0), b, r));
                          float l = length(g);
                          if (l < 0.0001) { return float2(0.0, -1.0); }
                          return g / l;
                      }
                      half4 main(float2 fc) {
                          float2 c = size * 0.5;
                          float2 p = fc - c;
                          float d = max(-sdRR(p, c, radius), 0.0);
                          float2 n = nrm(p, c, radius);
                          float edge = exp(-d / max(1.5, spread * 0.12));
                          float wide = exp(-d / max(2.0, spread * 0.6));
                          float2 L = normalize(float2(-0.55, -0.83));
                          float l1 = max(dot(n, L), 0.0);
                          float l2 = max(dot(n, -L), 0.0);
                          float spec = pow(l1, 2.0) + 0.55 * pow(l2, 2.0);
                          float2 q = abs(p) - (c - float2(radius));
                          float cw = smoothstep(-radius * 0.5, radius * 0.35, min(q.x, q.y));
                          float cornerSpec = cw * (pow(l1, 1.5) + 0.7 * pow(l2, 1.5));
                          float border = 1.0 - smoothstep(0.0, 1.6, d);
                          float a1 = rim * (0.50 * edge * spec + cglow * 1.1 * edge * cornerSpec
                                            + 0.22 * border + 0.10 * wide * l1);
                          float ty = fc.y / size.y;
                          float up = clamp(-n.y, 0.0, 1.0);
                          float dn = clamp(n.y, 0.0, 1.0);
                          float bev = exp(-d / max(2.0, spread * 0.45));
                          a1 += depth * (0.10 * (1.0 - ty) + 0.30 * bev * up);
                          float a2 = depth * (0.22 * smoothstep(0.5, 1.0, ty) + 0.32 * bev * dn);
                          a1 = clamp(a1, 0.0, 0.95);
                          a2 = clamp(a2, 0.0, 0.6);
                          float a = a1 + a2 * (1.0 - a1);
                          return half4(half(a1), half(a1), half(a1), half(a));
                      }
                      """;

              static final Map<View, GlassBar> BARS = Collections.synchronizedMap(new WeakHashMap<View, GlassBar>());
              static View sCapturing;

              public static boolean skip(View child) { return child != null && child == sCapturing; }
              public static boolean capturing() { return sCapturing != null; }
              public static boolean isGlass(View v) { return BARS.containsKey(v); }

              public static void onTouch(View v, MotionEvent e) {
                  if (e == null || BARS.isEmpty()) return;
                  GlassBar g = BARS.get(v);
                  if (g != null) g.touch(e);
              }

              public static boolean blocks(View v, Drawable d) {
                  GlassBar g = BARS.get(v);
                  return g != null && g.installed && !g.installing && d != g.glass;
              }

              public static boolean hasGlassAncestor(View v) {
                  ViewParent p = v.getParent();
                  while (p != null) {
                      if (p instanceof View && BARS.containsKey(p)) return true;
                      p = p.getParent();
                  }
                  return false;
              }

              public static GlassBar attach(View bar, GlassConfig cfg, Refresher r, boolean windowMode) {
                  return attach(bar, cfg, r, windowMode, false, false);
              }

              public static GlassBar attach(View bar, GlassConfig cfg, Refresher r, boolean windowMode,
                                            boolean fitApp, boolean noSlider) {
                  GlassBar g = BARS.get(bar);
                  if (g != null) return g;
                  g = new GlassBar(bar, cfg, r, windowMode);
                  g.fitApp = fitApp; g.noSlider = noSlider;
                  BARS.put(bar, g);
                  g.install();
                  return g;
              }

              final View bar;
              final GlassConfig cfg;
              final Refresher refresher;
              final boolean windowMode;
              final float density;
              final RenderNode node = new RenderNode("GlassBackdrop");
              final Glass glass = new Glass();
              final Path path = new Path();
              final RectF rf = new RectF();
              final Paint tintPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
              final int[] la = new int[2], lb = new int[2];

              Paint lightPaint;
              Drawable origBg, blurDrawable;
              ViewOutlineProvider origOutline;
              boolean origClip;
              ViewTreeObserver vto;
              boolean installed, installing, forceRecord = true;
              boolean fitApp, noSlider;
              int fx, fy, fw, fh;
              int appliedRev = -1, lastW, lastH, lw = 1, lh = 1, hash;
              long lastRefresh;
              Bitmap bmp;
              Canvas bmpCanvas;
              int[] px;

              final ViewOutlineProvider glassOutline = new ViewOutlineProvider() {
                  @Override
                  public void getOutline(View v, Outline o) {
                      if (fw > 0 && fh > 0) {
                          o.setRoundRect(fx, fy, fx + fw, fy + fh, Math.min(cfg.cornerDp * density, Math.min(fw, fh) / 2f));
                          return;
                      }
                      float r = Math.min(cfg.cornerDp * density, Math.min(v.getWidth(), v.getHeight()) / 2f);
                      o.setRoundRect(0, 0, v.getWidth(), v.getHeight(), r);
                  }
              };

              private GlassBar(View bar, GlassConfig cfg, Refresher r, boolean windowMode) {
                  this.bar = bar; this.cfg = cfg; this.refresher = r;
                  this.windowMode = windowMode;
                  this.density = bar.getResources().getDisplayMetrics().density;
              }

              // ---- dokunma sicramasi (yay fizigi) ----
              static final float STIFF = 420f, ZETA = 0.36f;
              float sx = 1f, sy = 1f, vx, vy;
              boolean pressed, springing;
              long lastT;
              final Runnable tick = new Runnable() { @Override public void run() { stepSpring(); } };

              public void touch(MotionEvent e) {
                  if (!installed) return;
                  if (lensOn) { try { lensTouch(e); } catch (Throwable t) { if (cfg.debug) Log.w(TAG, "lens", t); } }
                  if (cfg.bouncePct <= 0f) return;
                  int a = e.getActionMasked();
                  if (a == MotionEvent.ACTION_DOWN) {
                      if (Math.abs(sx - 1f) < 0.01f && Math.abs(sy - 1f) < 0.01f) {
                          bar.setPivotX(Math.max(0f, Math.min(bar.getWidth(), e.getX())));
                          bar.setPivotY(bar.getHeight() / 2f);
                      }
                      pressed = true; kick();
                  } else if (a == MotionEvent.ACTION_UP || a == MotionEvent.ACTION_CANCEL) {
                      pressed = false; kick();
                  }
              }

              private void kick() {
                  if (springing) return;
                  springing = true; lastT = SystemClock.uptimeMillis();
                  bar.postOnAnimation(tick);
              }

              private void stepSpring() {
                  if (!bar.isAttachedToWindow()) { resetBounce(); return; }
                  long now = SystemClock.uptimeMillis();
                  float dt = Math.min(0.032f, (now - lastT) / 1000f); lastT = now;
                  float k = cfg.bouncePct / 100f;
                  float tx = pressed ? 1f + 0.045f * k : 1f;
                  float ty = pressed ? 1f + 0.12f * k : 1f;
                  float damp = 2f * ZETA * (float) Math.sqrt(STIFF);
                  int n = Math.max(1, (int) Math.ceil(dt / 0.004f));
                  float h = dt / n;
                  for (int i = 0; i < n; i++) {
                      vx += (-STIFF * (sx - tx) - damp * vx) * h; sx += vx * h;
                      vy += (-STIFF * (sy - ty) - damp * vy) * h; sy += vy * h;
                  }
                  boolean rest = Math.abs(sx - tx) < 0.0005f && Math.abs(sy - ty) < 0.0005f
                          && Math.abs(vx) < 0.01f && Math.abs(vy) < 0.01f;
                  if (rest) { sx = tx; sy = ty; vx = 0f; vy = 0f; springing = false; }
                  bar.setScaleX(sx); bar.setScaleY(sy);
                  if (!rest) bar.postOnAnimation(tick);
              }

              private void resetBounce() {
                  bar.removeCallbacks(tick);
                  boolean was = springing || pressed || sx != 1f || sy != 1f;
                  springing = false; pressed = false; sx = 1f; sy = 1f; vx = 0f; vy = 0f;
                  if (was) { bar.setScaleX(1f); bar.setScaleY(1f); }
              }

              // ---- oturma (fit): cam, cubugun gercek icerigine oturur ----
              private boolean computeFit(int w, int h) {
                  int x0 = 0, y0 = 0, x1 = w, y1 = h;
                  if (fitApp && cfg.autoFit && bar instanceof ViewGroup) {
                      ViewGroup g = (ViewGroup) bar;
                      int l = Integer.MAX_VALUE, t = Integer.MAX_VALUE, r = Integer.MIN_VALUE, b = Integer.MIN_VALUE;
                      for (int i = 0; i < g.getChildCount(); i++) {
                          View c = g.getChildAt(i);
                          if (c.getVisibility() != View.VISIBLE || c.getWidth() <= 0 || c.getHeight() <= 0) continue;
                          l = Math.min(l, c.getLeft()); t = Math.min(t, c.getTop());
                          r = Math.max(r, c.getRight()); b = Math.max(b, c.getBottom());
                      }
                      if (r > l && b > t) {
                          int padX = Math.round(10f * density), padY = Math.round(6f * density);
                          int a0 = Math.max(0, l - padX), a1 = Math.min(w, r + padX);
                          int b0 = Math.max(0, t - padY), b1 = Math.min(h, b + padY);
                          if (a1 - a0 >= w * 0.5f && b1 - b0 >= 36f * density) { x0 = a0; x1 = a1; y0 = b0; y1 = b1; }
                      }
                  }
                  int mx = Math.round(cfg.fitXDp * density), mb = Math.round(cfg.fitBottomDp * density);
                  x0 += mx; x1 -= mx; y1 -= mb;
                  if (x1 - x0 < 8 || y1 - y0 < 8) { x0 = 0; y0 = 0; x1 = w; y1 = h; }
                  boolean moved = x0 != fx || y0 != fy;
                  fx = x0; fy = y0; fw = x1 - x0; fh = y1 - y0;
                  return moved;
              }

              // ---- deneysel: iPhone tarzi cam kaydirma lensi (varsayilan kapali, dokunmayi tuketmez) ----
              static final float LX_K = 300f, LS_K = 520f, LP_K = 360f;
              final float[] ic = new float[8], iw = new float[8];
              final View[] iv = new View[8];
              int nIt, sel;
              float cmin, cmax;
              Lens lens;
              boolean lensOn, lensInit, lensAnim, lDrag, lMoved;
              float lx, lvx, ltx, lsc = 1f, lvs, lpress, lpv, la2, lta, lensW, lensH, lcy, lDownX;
              View lDownView;
              long lensT, lHold;
              final Runnable lensTick = new Runnable() { @Override public void run() { lensStep(); } };

              private void collectItems() {
                  nIt = 0; sel = -1; cmin = Float.MAX_VALUE; cmax = -Float.MAX_VALUE;
                  if (!(bar instanceof ViewGroup)) return;
                  ViewGroup g = (ViewGroup) bar; float ox = 0f;
                  for (int d = 0; d < 4; d++) {
                      ViewGroup next = null; int groups = 0;
                      for (int i = 0; i < g.getChildCount(); i++) {
                          View c = g.getChildAt(i);
                          if (c.getVisibility() != View.VISIBLE || c.getWidth() <= 0) continue;
                          if (c instanceof ViewGroup && ((ViewGroup) c).getChildCount() > 1
                                  && c.getWidth() >= g.getWidth() * 0.6f) { groups++; next = (ViewGroup) c; }
                      }
                      if (groups != 1) break;
                      ox += next.getLeft(); g = next;
                  }
                  for (int i = 0; i < g.getChildCount(); i++) {
                      View c = g.getChildAt(i);
                      if (c.getVisibility() != View.VISIBLE || c.getWidth() <= 0) continue;
                      if (g.getChildCount() > 1 && c.getWidth() >= g.getWidth() * 0.9f) continue;
                      if (nIt >= 8) { nIt = 0; sel = -1; return; }
                      float cx = ox + c.getLeft() + c.getTranslationX() + c.getWidth() / 2f;
                      iv[nIt] = c; ic[nIt] = cx; iw[nIt] = c.getWidth();
                      cmin = Math.min(cmin, cx); cmax = Math.max(cmax, cx);
                      if (sel < 0 && (c.isSelected() || c.isActivated())) sel = nIt;
                      nIt++;
                  }
              }

              private int nearest(float x) {
                  int best = 0; float bd = Float.MAX_VALUE;
                  for (int i = 0; i < nIt; i++) { float dd = Math.abs(ic[i] - x); if (dd < bd) { bd = dd; best = i; } }
                  return best;
              }

              private void syncLens() {
                  boolean want = cfg.enabled && cfg.sliderEnabled && !noSlider && installed;
                  if (!want) {
                      if (lensOn) {
                          lensOn = false; lDrag = false; lensAnim = false; lensInit = false;
                          bar.removeCallbacks(lensTick);
                          try { bar.getOverlay().remove(lens); } catch (Throwable ignored) {}
                          lens = null;
                      }
                      return;
                  }
                  if (!lensOn) {
                      lens = new Lens(); lensOn = true; lensInit = false; la2 = 0f; lta = 0f;
                      bar.getOverlay().add(lens);
                  }
                  int w = bar.getWidth(), h = bar.getHeight();
                  if (w <= 0 || h <= 0) return;
                  lens.setBounds(0, 0, w, h);
                  collectItems();
                  if (nIt < 2) {
                      lta = 0f;
                  } else {
                      float avg = 0f;
                      for (int i = 0; i < nIt; i++) avg += iw[i];
                      avg /= nIt;
                      lensW = Math.min(fw - 8f * density, Math.max(52f * density, avg - 6f * density));
                      lensH = Math.min(fh, Math.max(28f * density, fh - 10f * density));
                      lcy = fy + fh / 2f;
                      if (!lDrag && SystemClock.uptimeMillis() >= lHold) {
                          if (sel >= 0) { ltx = ic[sel]; lta = 1f; } else lta = 0f;
                      }
                      if (!lensInit && sel >= 0) { lensInit = true; lx = ltx; la2 = lta; lvx = 0f; }
                  }
                  if (!lensAnim && (Math.abs(lx - ltx) > 0.3f || Math.abs(la2 - lta) > 0.01f)) kickLens();
              }

              private void lensTouch(MotionEvent e) {
                  if (nIt < 2) return;
                  int a = e.getActionMasked(); float x = e.getX();
                  if (a == MotionEvent.ACTION_DOWN) {
                      float y = e.getY();
                      if (x < fx || x > fx + fw || y < fy || y > fy + fh) return;
                      int i = nearest(x);
                      lDrag = true; lMoved = false; lDownX = x; lDownView = iv[i];
                      ltx = ic[i]; lta = 1f;
                      if (!lensInit) { lensInit = true; lx = ltx; la2 = 0f; }
                      kickLens();
                  } else if (!lDrag) {
                      return;
                  } else if (a == MotionEvent.ACTION_MOVE) {
                      if (!lMoved && Math.abs(x - lDownX) > ViewConfiguration.get(bar.getContext()).getScaledTouchSlop()) lMoved = true;
                      if (lMoved) ltx = Math.max(cmin, Math.min(cmax, x));
                      kickLens();
                  } else if (a == MotionEvent.ACTION_UP || a == MotionEvent.ACTION_CANCEL) {
                      lDrag = false;
                      int i = nearest(x);
                      ltx = ic[i]; lta = 1f; lHold = SystemClock.uptimeMillis() + 450;
                      if (a == MotionEvent.ACTION_UP && lMoved && cfg.sliderSwitch) {
                          final View t = iv[i];
                          if (t != null && t != lDownView) bar.post(new Runnable() { @Override public void run() { t.performClick(); } });
                      }
                      kickLens();
                      bar.postDelayed(new Runnable() { @Override public void run() { bar.invalidate(); } }, 480);
                  }
              }

              private void kickLens() {
                  if (!lensOn || lensAnim) return;
                  lensAnim = true; lensT = SystemClock.uptimeMillis();
                  bar.postOnAnimation(lensTick);
              }

              private void lensStep() {
                  if (!lensOn || lens == null || !bar.isAttachedToWindow()) { lensAnim = false; return; }
                  long now = SystemClock.uptimeMillis();
                  float dt = Math.min(0.032f, (now - lensT) / 1000f); lensT = now;
                  float tsc = lDrag ? 1.12f : 1f, tpr = lDrag ? 1f : 0f;
                  float dX = 2f * 0.70f * (float) Math.sqrt(LX_K);
                  float dS = 2f * 0.50f * (float) Math.sqrt(LS_K);
                  float dP = 2f * 0.90f * (float) Math.sqrt(LP_K);
                  int n = Math.max(1, (int) Math.ceil(dt / 0.004f));
                  float h = dt / n;
                  for (int i = 0; i < n; i++) {
