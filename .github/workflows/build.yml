                  String n = idName(v); if (n == null) return false;
                  n = n.toLowerCase(Locale.ROOT);
                  if (hasAny(n, EXCL)) return false;
                  if (hasAny(n, IDS)) return true;
                  if (home && hasAny(n, HOME_TOK)) return true;
                  for (String t : cfg.customTokens) if (n.contains(t)) return true;
                  return false;
              }

              static String idName(View v) {
                  try { return v.getResources().getResourceEntryName(v.getId()); } catch (Throwable t) { return null; }
              }
              static String simple(Class<?> c) { String n = c.getName(); return n.substring(n.lastIndexOf('.') + 1).toLowerCase(Locale.ROOT); }
              static boolean hasAny(String s, String[] toks) { for (String t : toks) if (s.contains(t)) return true; return false; }
          }
